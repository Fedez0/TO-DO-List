version: '3.8'

services:
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: Micai0mo!
      MYSQL_DATABASE: site
      MYSQL_USER: todolistuser
      MYSQL_PASSWORD: Micai0mo!
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
      start_period: 30s
  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.dev
    ports:
      - "80:5173"
    container_name: to-do-list-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    container_name: to-do-list-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Micai0mo!
      - DB_NAME=site
    restart: unless-stopped

# Network opzionale
networks:
  default:
    name: to-do-list-network